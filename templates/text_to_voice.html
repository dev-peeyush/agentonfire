<!doctype html>
<html>
  <head>
    <title>PCM Streaming Test</title>
  </head>
  <body>
    <textarea id="text" rows="5" cols="60">
Tell me a funny story.
</textarea
    >

    <br /><br />

    <button onclick="play()">Play</button>

    <script>
      async function play() {
        const response = await fetch("/api/v1/text_to_voice", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJmaXJzdF9uYW1lIjoiUGVleXVzaCIsImxhc3RfbmFtZSI6IlNpbmdoIiwiZW1haWwiOiJoZWxsb0BoZWxsby5jb20iLCJpZCI6IjAxS1lIUFg1UkJQWk41UFIySkZLM1RZVjNYIiwidHlwZSI6ImFjY2VzcyIsImV4cCI6MTc4NTU4Njg4MH0.wQLLjuIgSHYSFzZ-yi9uM4pvgYK7v4m6wY2PkOsIiDs`,
          },
          body: JSON.stringify({
            text: document.getElementById("text").value,
          }),
        });

        const reader = response.body.getReader();
        const audioContext = new AudioContext({ sampleRate: 24000 });
        let nextPlayTime = audioContext.currentTime;

        let leftover = null; // holds a single dangling byte across reads

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          let chunk = value;

          // Prepend leftover byte from previous read, if any
          if (leftover !== null) {
            const merged = new Uint8Array(chunk.length + 1);
            merged[0] = leftover;
            merged.set(chunk, 1);
            chunk = merged;
            leftover = null;
          }

          // If odd length, stash the last byte for the next chunk
          if (chunk.byteLength % 2 !== 0) {
            leftover = chunk[chunk.byteLength - 1];
            chunk = chunk.subarray(0, chunk.byteLength - 1);
          }

          if (chunk.byteLength === 0) continue;

          // Copy into a fresh, aligned buffer (chunk.byteOffset may not be even)
          const int16 = new Int16Array(chunk.byteLength / 2);
          const dv = new DataView(
            chunk.buffer,
            chunk.byteOffset,
            chunk.byteLength,
          );
          for (let i = 0; i < int16.length; i++) {
            int16[i] = dv.getInt16(i * 2, true); // little-endian
          }

          const float32 = new Float32Array(int16.length);
          for (let i = 0; i < int16.length; i++) {
            float32[i] = int16[i] / 32768.0;
          }

          const buffer = audioContext.createBuffer(1, float32.length, 24000);
          buffer.copyToChannel(float32, 0);

          const source = audioContext.createBufferSource();
          source.buffer = buffer;
          source.connect(audioContext.destination);

          // Avoid scheduling in the past if network was slow
          const startAt = Math.max(nextPlayTime, audioContext.currentTime);
          source.start(startAt);
          nextPlayTime = startAt + buffer.duration;
        }
      }
    </script>
  </body>
</html>
