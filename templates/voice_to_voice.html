<!doctype html>
<html>
  <head>
    <title>Voice-to-Voice Streaming Test</title>
  </head>
  <body>
    <h3>Upload audio (mp3)</h3>
    <input type="file" id="audioFile" accept="audio/mpeg,audio/wav,audio/mp3" />

    <br /><br />
    <button onclick="play()">Send &amp; Play Response</button>
    <p id="status"></p>

    <script>
      const AUTH_TOKEN = "YOUR_TOKEN_HERE"; // replace with your bearer token

      async function play() {
        const fileInput = document.getElementById("audioFile");
        const statusEl = document.getElementById("status");

        if (!fileInput.files.length) {
          statusEl.textContent = "Please select an audio file first.";
          return;
        }

        statusEl.textContent = "Uploading & waiting for response...";

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        const response = await fetch("/api/v1/voice_to_voice_conversation", {
          method: "POST",
          headers: {
            Authorization: `Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJmaXJzdF9uYW1lIjoiUGVleXVzaCIsImxhc3RfbmFtZSI6IlNpbmdoIiwiZW1haWwiOiJoZWxsb0BoZWxsby5jb20iLCJpZCI6IjAxS1lIUFg1UkJQWk41UFIySkZLM1RZVjNYIiwidHlwZSI6ImFjY2VzcyIsImV4cCI6MTc4NTkyMDQ3MX0.ee2zKM7oSaiEndP7-M9osNvfgocs6f9qutUwUIcKdHk`,
            // Do NOT set Content-Type manually — browser sets the
            // correct multipart boundary automatically for FormData
          },
          body: formData,
        });

        if (!response.ok || !response.body) {
          statusEl.textContent = `Error: ${response.status} ${response.statusText}`;
          return;
        }

        statusEl.textContent = "Streaming audio...";

        const reader = response.body.getReader();
        const audioContext = new AudioContext({ sampleRate: 24000 });
        let nextPlayTime = audioContext.currentTime;

        let leftover = null; // holds a single dangling byte across reads

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          let chunk = value;

          // Prepend leftover byte from previous read, if any
          if (leftover !== null) {
            const merged = new Uint8Array(chunk.length + 1);
            merged[0] = leftover;
            merged.set(chunk, 1);
            chunk = merged;
            leftover = null;
          }

          // If odd length, stash the last byte for the next chunk
          if (chunk.byteLength % 2 !== 0) {
            leftover = chunk[chunk.byteLength - 1];
            chunk = chunk.subarray(0, chunk.byteLength - 1);
          }

          if (chunk.byteLength === 0) continue;

          // Copy into a fresh, aligned buffer (chunk.byteOffset may not be even)
          const int16 = new Int16Array(chunk.byteLength / 2);
          const dv = new DataView(
            chunk.buffer,
            chunk.byteOffset,
            chunk.byteLength,
          );
          for (let i = 0; i < int16.length; i++) {
            int16[i] = dv.getInt16(i * 2, true); // little-endian
          }

          const float32 = new Float32Array(int16.length);
          for (let i = 0; i < int16.length; i++) {
            float32[i] = int16[i] / 32768.0;
          }

          const buffer = audioContext.createBuffer(1, float32.length, 24000);
          buffer.copyToChannel(float32, 0);

          const source = audioContext.createBufferSource();
          source.buffer = buffer;
          source.connect(audioContext.destination);

          const startAt = Math.max(nextPlayTime, audioContext.currentTime);
          source.start(startAt);
          nextPlayTime = startAt + buffer.duration;
        }

        statusEl.textContent = "Done.";
      }
    </script>
  </body>
</html>
